
name: Build VPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Herramientas nativas
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --target zipdir lemon re2c -j$(nproc)

      - name: Compilar para Vita
        run: |
          cmake -S . -B build-vita \
            -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMPORT_EXECUTABLES=$PWD/build-native/ImportExecutables.cmake
          cmake --build build-vita -j$(nproc)

      - name: Subir VPK
        uses: actions/upload-artifact@v4
        with:
          name: vpk
          path: build-vita/**/*.vpk
          if-no-files-found: error
